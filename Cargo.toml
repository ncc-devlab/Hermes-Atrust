[workspace]
members = [
    "apps/atrust-probe",
    "crates/atrust-auth",
    "crates/atrust-protocol",
    "crates/hermes-logging",
    "crates/hermes-model",
    "crates/hermes-transport",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1.88"
base64 = "0.22.1"
clap = { version = "4.5.37", features = ["derive"] }
futures-util = "=0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
rand = "0.9.1"
reqwest = { version = "0.12.15", default-features = false, features = ["cookies", "rustls-tls", "stream"] }
rsa = "0.9.8"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-tungstenite = { version = "0.26.2", default-features = false, features = ["connect"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
url = "2.5.4"
zeroize = "1.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
